<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>MM26 Karte</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #f4f5f7; --fg: #111; --muted: #666; --card: #fff; --line: #222; --thin: #999;
    --orange: #FFC000; --rot: #FF5050; --grau: #D9D9D9; --sez: #BFBFBF; --top: #1F3864;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Roboto Condensed", "Arial Narrow", Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--top); color: #fff;
    padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
  header .t { font-weight: 700; font-size: 17px; }
  header .s { font-size: 12px; opacity: .85; margin-left: auto; text-align: right; }
  main { padding: 10px 12px 90px; max-width: 560px; margin: 0 auto; }
  .row { display: flex; gap: 8px; }
  input[type=text], input[type=search], input[type=password] { flex: 1; font-size: 20px; padding: 10px; border: 1px solid #aaa;
    border-radius: 8px; min-width: 0; }
  button { font-size: 17px; padding: 10px 14px; border-radius: 8px; border: 0; background: var(--top);
    color: #fff; font-weight: 700; }
  button.sec { background: #e3e6ec; color: #111; }
  #scan { position: relative; margin: 10px 0; border-radius: 10px; overflow: hidden; background: #000;
    display: none; aspect-ratio: 4 / 3; }
  #scan video { width: 100%; height: 100%; object-fit: cover; }
  #scan .ziel { position: absolute; left: 10%; right: 10%; top: 38%; height: 24%;
    border: 3px solid rgba(255,255,255,.85); border-radius: 8px; box-shadow: 0 0 0 999px rgba(0,0,0,.25); }
  .msg { padding: 10px; border-radius: 8px; background: #fff3cd; margin: 10px 0; font-size: 15px; }
  .err { background: #f8d7da; }
  .karte { background: var(--card); border: 2.5px solid var(--line); border-radius: 6px; margin: 10px 0;
    overflow: hidden; }
  .k1 { display: grid; grid-template-columns: 1fr auto auto auto; align-items: stretch;
    border-bottom: 1px solid var(--thin); }
  .k1 > div { padding: 6px 8px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .k1 .art { font-weight: 800; font-size: 26px; justify-content: flex-start; }
  .k1 .abc { background: var(--grau); font-weight: 700; min-width: 36px; }
  .k1 .logi { min-width: 90px; }
  .k1 .lc { min-width: 34px; font-weight: 800; }
  .mitte { display: grid; grid-template-columns: 32% 15% 1fr; border-bottom: 1px solid var(--thin); }
  .kspalte { display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 4px 4px 8px;
    border-right: 1px solid var(--thin); }
  .kspalte div { font-size: 11px; color: var(--muted); line-height: 1.1; }
  .kspalte b { display: block; font-size: 17px; color: #111; }
  .foto { display: flex; align-items: center; justify-content: center; padding: 4px;
    border-right: 1px solid var(--thin); background: #fff; }
  .foto img { max-width: 100%; max-height: 120px; }
  .foto .nm { font-size: 12px; color: #333; padding: 4px; display: -webkit-box; -webkit-line-clamp: 6;
    -webkit-box-orient: vertical; overflow: hidden; }
  table.grid { width: 100%; border-collapse: collapse; font-size: 18px; }
  table.grid th { font-size: 12px; color: var(--muted); font-weight: 600; padding: 3px 2px; }
  table.grid td { border: 1px solid var(--thin); text-align: center; padding: 6px 2px; }
  table.grid td.lbl { border: 0; font-size: 10px; color: var(--muted); padding: 0 1px; width: 14px;
    writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; white-space: nowrap; }
  .promo { background: var(--rot); }
  table.grid td { position: relative; }
  table.grid td.tr { padding: 2px 3px; }
  .treppe { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 9px);
    font-size: 10px; line-height: 9px; font-weight: 600; }
  .treppe span { text-align: center; }
  .treppe .null { color: #9a9a9a; font-weight: 400; }
  table.kreise { width: 100%; border-collapse: collapse; }
  table.kreise th { font-size: 12px; color: var(--muted); font-weight: 600; padding: 2px; }
  table.kreise td { border: 1px solid var(--thin); text-align: center; padding: 3px 0 1px; }
  table.kreise td.lief { background: #FFF59D; box-shadow: inset 0 0 0 3px #FFE600; }
  table.kreise td.kw { border: 0; font-size: 12px; color: var(--muted); width: 30px; }
  .hbtn { background: rgba(255,255,255,.15); color: #fff; font-size: 14px; padding: 6px 9px; border-radius: 7px; }
  .mhdzeile { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 2px -2px; }
  .mhdbtn { font-size: 14px; padding: 6px 10px; }
  .mhdtag { font-size: 13px; padding: 4px 7px; border-radius: 6px; background: #E2EFDA; font-weight: 600; }
  .mhdtag.gelb, .mhdrow.gelb { background: #FFF2CC; } .mhdtag.rot, .mhdrow.rot { background: #F8CBAD; }
  .mhdbox { background: #fff; border: 2px solid var(--top); border-radius: 8px; padding: 10px; margin: 8px 0; }
  .mhdbox input[type=date], .mhdbox input[type=number], .mhdbox input[type=text] { font-size: 18px; padding: 8px; border: 1px solid #aaa; border-radius: 8px; }
  .mhdtitel { font-weight: 700; margin-bottom: 8px; }
  .mhdfoto { display: inline-block; background: #e3e6ec; padding: 10px 14px; border-radius: 8px; font-weight: 700; }
  .mhdprev { max-width: 100%; max-height: 180px; margin-top: 8px; border-radius: 6px; }
  .mhdrow { background: #fff; border-radius: 8px; padding: 8px 10px; margin: 6px 0; border: 1px solid #ccc; }
  .mhdrow a { color: #111; display: block; margin: 3px 0; }
  .mhdrow.zu { color: var(--muted); font-size: 13px; }
  .mhdakt button { font-size: 13px; padding: 6px 9px; }
  .mapz { font-size: 12px; color: #1F4E9E; margin: 6px 2px -4px; }
  table.grid td .pct { position: absolute; right: 3px; bottom: 1px; font-size: 7.5px; color: #808080; line-height: 1; }
  .schwarz { background: #000; color: #fff; } .schwarz .lb { color: #ccc; }
  .klz { display: block; font-size: 11px; font-weight: 400; color: #333; line-height: 1.1; }
  .slz { display: block; font-size: 14px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
  .slz i { font-style: normal; font-weight: 400; font-size: 10px; color: var(--muted); }
  .slz.rot { color: #c00000; }
  .slbox { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .slbox { padding: 2px 1px !important; }
  .slbox .slz { font-size: 13px; letter-spacing: -0.2px; }
  .slbox .slz i { font-size: 8.5px; }
  main { padding-bottom: 110px; }
  .koef { display: flex; gap: 14px; padding: 5px 8px; font-size: 15px; border-bottom: 1px solid var(--thin); }
  .koef b { font-size: 17px; }
  .tiles { display: grid; grid-template-columns: repeat(6, 1fr); border-bottom: 1px solid var(--thin); }
  .tiles > div, .unten > div { border-right: 1px solid var(--thin); padding: 3px 2px 5px; text-align: center;
    min-width: 0; }
  .tiles > div:last-child, .unten > div:last-child { border-right: 0; }
  .lb { display: block; font-size: 10.5px; color: var(--muted); line-height: 1.2; }
  .v { display: block; font-size: 16px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
  .tiles .v { font-size: 14px; }
  .o { background: var(--orange); } .r { background: var(--rot); } .g { background: var(--sez); }
  .unten { display: grid; grid-template-columns: 1fr 1fr 1fr 3fr; }
  .verdikt { display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px;
    text-align: center; }
  .titel { font-weight: 700; font-size: 14px; margin: 12px 2px -4px; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .wgzeile { font-size: 13px; color: #333; margin: 4px 2px 8px; }
  .wgzeile b { color: #111; } .wgzeile .plus { color: #2e7d32; font-weight: 700; } .wgzeile .minus { color: #c00000; font-weight: 700; }
  .grauf { background: #D9D9D9; }
  .titel .inh { color: var(--muted); font-weight: 400; }
  table.t2 { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.t2 td { border: 1px solid var(--thin); padding: 4px 3px 6px; text-align: center; vertical-align: top; }
  table.t2 td .lb { font-size: 10.5px; }
  table.t2 td .v { font-size: 16px; }
  table.t2 td.links { text-align: left; font-size: 14px; font-weight: 400; }
  table.t2 td.kopf { background: #eef1f6; font-size: 11px; color: #333; font-weight: 700; vertical-align: middle; }
  .blau { color: #1F4E9E; }
  .gelbf { background: #FFF2CC; }
  .rotf { background: #F8CBAD; }
  .hist { background: #fff; border: 2.5px solid var(--line); border-radius: 6px; margin: 10px 0; padding: 6px 4px 2px; }
  .hist .ht { font-size: 12px; color: var(--muted); padding: 0 4px 2px; }
  .det { background: #fff; border-radius: 8px; padding: 8px 10px; font-size: 15px; line-height: 1.45; }
  .det .n { font-weight: 700; font-size: 16px; }
  .det .l { color: var(--muted); }
  .det .rot { color: #c00000; }
  h3 { margin: 16px 0 6px; font-size: 15px; color: #333; }
  .regal { display: flex; flex-wrap: wrap; gap: 6px; }
  .regal a { display: block; padding: 7px 9px; border-radius: 6px; background: #fff; border: 1px solid #bbb;
    color: #111; text-decoration: none; font-size: 15px; }
  .regal a.akt { border: 2.5px solid var(--top); font-weight: 800; }
  .regal a.leer { color: #999; }
  .wahl a { display: block; padding: 10px; background: #fff; border-radius: 8px; margin: 6px 0; color: #111;
    text-decoration: none; border: 1px solid #bbb; }
  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 6;
    font-size: 19px; padding: 14px 26px; border-radius: 30px; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .klein { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="t">MM26 · карточка</div>
  <button class="hbtn" id="mhdtab" style="display:none">📅 Сроки</button>
  <button class="hbtn" id="einst" style="display:none">⚙</button>
  <div class="s" id="stand">загрузка…</div>
</header>
<main>
  <div id="login" style="display:none">
    <div class="msg">Введите пароль (тот, что в karte_passwort.txt). Он сохранится на этом телефоне.</div>
    <div class="row">
      <input id="pw" type="password" autocomplete="current-password" placeholder="пароль">
      <button id="pwok">OK</button>
    </div>
  </div>

  <div id="app" style="display:none">
    <form class="row" id="suchform" action="#" onsubmit="return false">
      <input id="code" type="search" enterkeyhint="search" placeholder="артикул, EAN или название" autocomplete="off">
      <button id="suche" type="submit">→</button>
    </form>
    <div id="scan"><video id="video" playsinline muted></video><div class="ziel"></div></div>
    <div id="out"></div>
  </div>
  <div id="info"></div>
</main>
<button class="fab" id="scanbtn" style="display:none">📷 Сканировать</button>

<script>
"use strict";
const ITER = 250000;
let DATA = null, PW = null, AKTUELL = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (v) => (v === null || v === undefined || v === "") ? "—" : String(v).replace(".", ",");
const artKey = (s) => { s = String(s || "").trim(); return /^\d+$/.test(s) ? String(parseInt(s, 10)) : s.toUpperCase(); };

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

async function holeBlob() {
  const r = await fetch("data.enc?t=" + Date.now(), { cache: "no-store" });   // метка - мимо кеша GitHub (до 10 мин)
  if (!r.ok) throw new Error("data.enc: HTTP " + r.status);
  return new Uint8Array(await r.arrayBuffer());
}

async function entschluesseln(buf, pw) {
  const magic = new TextDecoder().decode(buf.slice(0, 4));
  if (magic !== "MM26") throw new Error("неверный формат файла");
  const salt = buf.slice(4, 20), nonce = buf.slice(20, 32), ct = buf.slice(32);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, key, ct);   // ошибка = неверный пароль
  const ds = new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip")));
  return JSON.parse(await ds.text());
}

async function start() {
  let buf;
  try { buf = await holeBlob(); }
  catch (e) { $("stand").textContent = "нет данных"; $("info").innerHTML = '<div class="msg err">Не удалось загрузить данные: ' + esc(e.message) + '</div>'; return; }
  const pw = lsGet("mm26pw");
  if (pw) {
    try { DATA = await entschluesseln(buf, pw); PW = pw; return bereit(); }
    catch (e) { lsDel("mm26pw"); }
  }
  $("login").style.display = "";
  $("pwok").onclick = async () => {
    const p = $("pw").value;
    $("pwok").disabled = true;
    try { DATA = await entschluesseln(buf, p); PW = p; lsSet("mm26pw", p); $("login").style.display = "none"; bereit(); }
    catch (e) { $("info").innerHTML = '<div class="msg err">Пароль не подошёл.</div>'; }
    $("pwok").disabled = false;
  };
}

// ---------- фото из пакетов fotos_N.enc (скачиваются один раз, дальше из памяти телефона) ----------
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n;
  for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(str) { const b = new TextEncoder().encode(str); let c = 0xFFFFFFFF;
  for (const x of b) c = CRC[(c ^ x) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
let FOTOKEY = null; const SHARD = {};
function shardUrl(i) { return "fotos_" + i + ".enc?v=" + DATA.fotos.v[i]; }
async function fotoKey() {
  if (!FOTOKEY) {
    const salt = Uint8Array.from(atob(DATA.fotos.salt), c => c.charCodeAt(0));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(PW), "PBKDF2", false, ["deriveKey"]);
    FOTOKEY = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }
  return FOTOKEY;
}
function ladeShard(i) {
  if (!SHARD[i]) SHARD[i] = (async () => {
    const r = await fetch(shardUrl(i));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const buf = new Uint8Array(await r.arrayBuffer());
    const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(4, 16) }, await fotoKey(), buf.slice(16));
    const t = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    return JSON.parse(t);
  })().catch(e => { delete SHARD[i]; return {}; });
  return SHARD[i];
}
async function holeFoto(a) {
  if (!DATA.fotos || !DATA.fotos.n) return null;
  const pack = await ladeShard(crc32(a) % DATA.fotos.n);
  return pack[a] || null;
}
function fotosVorladen() {      // скачать все пакеты в память телефона (без расшифровки), чтобы работало без сети
  if (!DATA.fotos || !DATA.fotos.n) return;
  for (let i = 0; i < DATA.fotos.n; i++) fetch(shardUrl(i)).catch(() => {});
}

function bereit() {
  $("mhdtab").style.display = ""; $("einst").style.display = "";
  $("mhdtab").onclick = () => { scanStop && scanAktiv && scanStop(); zeigeMhdListe(); };
  $("einst").onclick = einstellungen;
  setTimeout(mhdSync, 2500);
  setTimeout(fotosVorladen, 1500);
  $("info").innerHTML = "";
  $("stand").innerHTML = "данные: " + esc(DATA.stand) + "<br>KW " + esc(DATA.kw);
  $("app").style.display = "";
  $("suchform").addEventListener("submit", (e) => { e.preventDefault(); suche($("code").value); $("code").blur(); });
  if ("BarcodeDetector" in window) {
    $("scanbtn").style.display = "";
    $("scanbtn").onclick = () => (scanAktiv ? scanStop() : scanStart());
  } else {
    $("out").innerHTML = '<div class="msg">Сканер в этом браузере не поддерживается — откройте в Chrome на Android. Номер можно ввести вручную.</div>';
  }
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "mhd") zeigeMhdListe();
  else if (h) suche(h);
}

function sucheName(q) {
  const w = q.toLowerCase().split(/\s+/).filter(Boolean);
  const res = [];
  for (const [a, k] of Object.entries(DATA.items)) {
    const t = ((k.name || "") + " " + (k.name_de || "") + " " + (k.art || "")).toLowerCase();
    if (w.every(x => t.includes(x))) res.push(a);
    if (res.length >= 60) break;
  }
  if (!res.length) { $("out").innerHTML = '<div class="msg err">По «' + esc(q) + '» ничего не найдено.</div>'; return; }
  if (res.length === 1) return zeige(res[0]);
  $("out").innerHTML = '<h3>Найдено ' + res.length + (res.length >= 60 ? '+' : '') + ':</h3><div class="wahl">' +
    res.map(x => '<a href="#' + x + '" data-a="' + x + '">' + esc(DATA.items[x].art) + ' · ' + esc(DATA.items[x].name_de || DATA.items[x].name || "") +
      (DATA.items[x].orte && DATA.items[x].orte.length ? '' : ' <span class="klein">(вне планограммы)</span>') + '</a>').join("") + '</div>';
  bindLinks();
}

function suche(code) {
  const roh = String(code || "").trim();
  if (!roh) return;
  if (!/^[0-9MmCcRr\s]+$/.test(roh) || /[^\d\s]{3,}/.test(roh)) return sucheName(roh);
  code = roh.replace(/\s+/g, "");
  LETZTER_EAN = "";
  const items = DATA.items, a = artKey(code);
  const pluAlle = ((DATA.plu || {})[code] || []).map(x => typeof x === "string" ? { a: x, art: x, n: "" } : x);
  const pluTreffer = pluAlle.filter(x => x.a && items[x.a]).map(x => x.a);
  const pluOhne = pluAlle.filter(x => !(x.a && items[x.a]));
  if (items[a] && pluAlle.length && !(pluTreffer.length === 1 && pluTreffer[0] === a && !pluOhne.length)) {
    $("out").innerHTML = '<h3>' + esc(code) + ' — артикул или PLU весов?</h3><div class="wahl">' +
      '<a href="#' + a + '" data-a="' + a + '">артикул ' + esc(items[a].art) + ' · ' + esc(items[a].name_de || "") + '</a>' +
      pluTreffer.map(x => '<a href="#' + x + '" data-a="' + x + '">PLU ' + esc(code) + ' → ' + esc(items[x].art) + ' · ' +
        esc(items[x].name_de || "") + '</a>').join("") +
      pluOhne.map(x => '<a class="leer">PLU ' + esc(code) + ' → ' + esc(x.art || "без артикула") + ' · ' + esc(x.n) +
        ' <span class="klein">(нет продаж 90 дн и остатка)</span></a>').join("") + '</div>';
    bindLinks(); return;
  }
  if (items[a]) return zeige(a);
  if (pluTreffer.length === 1) return zeige(pluTreffer[0]);
  if (!pluTreffer.length && pluOhne.length) {
    $("out").innerHTML = '<div class="msg">PLU ' + esc(code) + ': ' + pluOhne.map(x => 'артикул <b>' + esc(x.art || "—") + '</b> ' +
      esc(x.n)).join("<br>") + '<br><span class="klein">Карточки нет: за 90 дней не продавался и нет остатка.</span></div>';
    return;
  }
  if (pluTreffer.length > 1) {
    $("out").innerHTML = '<h3>PLU ' + esc(code) + ' — несколько артикулов:</h3><div class="wahl">' +
      pluTreffer.map(x => '<a href="#' + x + '" data-a="' + x + '">' + esc(items[x].art) + ' · ' + esc(items[x].name_de || "") + '</a>').join("") + '</div>';
    bindLinks(); return;
  }
  const varianten = [code, "0" + code, code.replace(/^0+/, ""), "00" + code];   // UPC-A (12) <-> EAN-13
  let gef = [];
  for (const v of varianten) if (DATA.ean[v]) { gef = DATA.ean[v]; break; }
  const treffer = gef.filter(x => items[x]);
  if (treffer.length) LETZTER_EAN = code;
  if (treffer.length === 1) return zeige(treffer[0]);
  if (treffer.length > 1) {
    $("out").innerHTML = '<h3>Штрихкод ' + esc(code) + ' — несколько артикулов:</h3><div class="wahl">' +

function tageSeit(s) {          // "17.10.2026 19:51" -> дней назад
  const m = /^(\d\d)\.(\d\d)\.(\d{4})/.exec(s || "");
  if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]), h = new Date(); h.setHours(0, 0, 0, 0);
  return Math.round((h - d) / 86400000);
}

const KREIS_FARBE = ["#70AD47", "#4472C4", "#C0504D"];   // корзина, заказ, РЦ утром
function kreis(seg) {
  // 3 сектора по 120°: 0 сверху-слева, 1 справа, 2 снизу
  const r = 15, c = 17, start = [-210, -90, 30];
  let svg = '<svg viewBox="0 0 34 34" width="34" height="34">';
  for (let i = 0; i < 3; i++) {
    const a0 = start[i] * Math.PI / 180, a1 = (start[i] + 120) * Math.PI / 180;
    const x0 = c + r * Math.cos(a0), y0 = c + r * Math.sin(a0), x1 = c + r * Math.cos(a1), y1 = c + r * Math.sin(a1);
    const v = seg[i];
    const fill = v === true ? KREIS_FARBE[i] : (v === false ? "#E4E4E4" : "#FFFFFF");   // нет - светло-серый, нет данных - белый
    svg += '<path d="M' + c + ',' + c + ' L' + x0.toFixed(2) + ',' + y0.toFixed(2) + ' A' + r + ',' + r + ' 0 0 1 ' +
      x1.toFixed(2) + ',' + y1.toFixed(2) + ' Z" fill="' + fill + '" stroke="#fff" stroke-width="1.5"' +
      (v === null ? ' stroke-dasharray="2 2"' : '') + '></path>';
  }
  return svg + '<circle cx="17" cy="17" r="15" fill="none" stroke="#C8C8C8" stroke-width="0.6"></circle></svg>';
}

const MON = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];

const TEIL_NAME = ["обычные", "промо", "уценка", "сотр. −10%"];
function histogramm(k) {
  const mo = k.monate || [];
  if (!mo.length) return "";
  const W = 360, H = 160, top = 16, bottom = 22, n = mo.length, bw = W / n;
  const max = Math.max(1, ...mo.map(x => (x[2] || [x[1]]).reduce((p, t) => p + Math.max(t, 0), 0)));
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="продажи по месяцам">';
  mo.forEach((x, i) => {
    const total = x[1], teile = x[2] || [total, 0, 0, 0];
    const xx = i * bw + 4, w = bw - 8, aktuell = i === n - 1;
    let y = H - bottom;
    teile.forEach((t, j) => {                     // снизу вверх: обычные, промо, уценка, сотрудники
      if (!t || t <= 0) return;                   // возвраты (минус) не рисуем
      const h = (H - top - bottom) * t / max;
      y -= h;
      svg += '<rect x="' + xx + '" y="' + y + '" width="' + w + '" height="' + Math.max(h, 1) + '" fill="' + TEIL_FARBE[j] +
        '"' + (aktuell ? ' fill-opacity="0.55"' : '') + '><title>' + TEIL_NAME[j] + ': ' + fmt(Math.round(t)) + '</title></rect>';
    });
    svg += '<text x="' + (xx + w / 2) + '" y="' + (y - 3) + '" font-size="10" text-anchor="middle" fill="#111">' +
      (Math.round(total) > 0 ? fmt(Math.round(total)) : "") + '</text>';
    const m = +x[0].slice(5, 7) - 1;
    svg += '<text x="' + (xx + w / 2) + '" y="' + (H - 7) + '" font-size="10" text-anchor="middle" fill="#666">' +
      MON[m] + (m === 0 ? "'" + x[0].slice(2, 4) : "") + '</text>';
  });
  svg += '</svg>';
  const leg = TEIL_NAME.map((t, j) => '<span style="display:inline-flex;align-items:center;gap:3px;margin-right:9px">' +
    '<span style="width:10px;height:10px;border-radius:2px;background:' + TEIL_FARBE[j] + '"></span>' + t + '</span>').join("");
  return '<div class="hist"><div class="ht">продажи, шт в месяц (12 мес; последний — текущий, неполный)</div>' + svg +
    '<div class="ht" style="padding-bottom:4px">' + leg + '</div></div>';
}

// ======================= MHD: отметки сроков годности на полке =======================
// Записи уходят в Google-таблицу через Apps Script (URL + ключ вводятся один раз в ⚙).
// Фото нигде не хранится: только чтобы прочитать дату (распознавание на телефоне).
const MHD = {
  url: () => lsGet("mm26mhd_url") || "",
  key: () => lsGet("mm26mhd_key") || "",
  liste() { try { return JSON.parse(lsGet("mm26mhd_list") || "[]"); } catch (e) { return []; } },
  queue() { try { return JSON.parse(lsGet("mm26mhd_queue") || "[]"); } catch (e) { return []; } },
  setListe(l) { lsSet("mm26mhd_list", JSON.stringify(l)); },
  setQueue(q) { lsSet("mm26mhd_queue", JSON.stringify(q)); },
};
let LETZTER_EAN = "";

function tageBis(iso) {
  const d = new Date(iso + "T00:00:00"), h = new Date(); h.setHours(0, 0, 0, 0);
  return Math.round((d - h) / 86400000);
}
function isoDatum(v) {          // "2026-10-30" | "Fri Oct 30 2026 00:00:00 GMT+0100" | "2026-10-29T23:00:00.000Z" -> "2026-10-30"
  const t = String(v || "");
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  const d = new Date(t);
  if (isNaN(d)) return "";
  const ld = /T\d{2}:\d{2}.*Z$/.test(t) ? new Date(d.getTime() + 12 * 3600000) : d;   // UTC-полночь -> тот же день
  return ld.getFullYear() + "-" + String(ld.getMonth() + 1).padStart(2, "0") + "-" + String(ld.getDate()).padStart(2, "0");
}
function dmy(iso) { return iso ? iso.slice(8, 10) + "." + iso.slice(5, 7) + "." + iso.slice(2, 4) : ""; }
function uuid() { return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

async function mhdPost(obj) {
  const r = await fetch(MHD.url(), { method: "POST", body: JSON.stringify(Object.assign({ secret: MHD.key() }, obj)), redirect: "follow" });
  const j = await r.json();
  if (!j.ok) throw new Error(j.fehler || "ошибка сервера");
  return j;
}
async function mhdSync() {
  if (!MHD.url()) return false;
  let q = MHD.queue();
  for (const e of q.slice()) {
    try {
      await mhdPost(e);
      q = q.filter(x => !(x.id === e.id && x.action === e.action && x.status === e.status));
      MHD.setQueue(q);
    } catch (err) { break; }
  }
  try {
    const r = await fetch(MHD.url() + "?action=list&secret=" + encodeURIComponent(MHD.key()) + "&t=" + Date.now());
    const j = await r.json();
    if (j.ok) MHD.setListe(j.liste.map(x => Object.assign(x, { mhd: isoDatum(x.mhd) })));
  } catch (err) { return false; }
  return true;
}
function mhdAlle() {          // сервер + ещё не отправленное
  const l = MHD.liste();
  const ids = new Set(l.map(x => x.id));
  const q = MHD.queue();
  for (const e of q) {
    if (e.action === "add" && !ids.has(e.id)) l.push(Object.assign({ status: "активен", offen: true }, e));
    if (e.action === "status") { const x = l.find(y => y.id === e.id); if (x) { x.status = e.status; x.offen = true; } }
  }
  return l;
}

// ---------- распознавание даты на фото ----------
let TESS = null;
function ladeTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (TESS) return TESS;
  TESS = new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = ok; s.onerror = () => { TESS = null; fail(new Error("распознавание недоступно (нет сети?)")); };
    document.head.appendChild(s);
  });
  return TESS;
}
function datumAusText(t) {
  t = (t || "").replace(/[oO]/g, "0").replace(/[lI|]/g, "1").replace(/,/g, ".");
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const kand = [];
  const add = (y, m, d) => {
    if (y < 100) y += 2000;
    if (m < 1 || m > 12 || d < 1 || d > 31 || y < 2020 || y > 2040) return;
    const dt = new Date(y, m - 1, d);
    if (dt.getMonth() !== m - 1) return;
    kand.push(dt);
  };
  let m;
  const r1 = /(\d{1,2})\s*[.\/\-]\s*(\d{1,2})\s*[.\/\-]\s*(\d{2,4})/g;          // 25.10.2026 / 25/10/26
  while ((m = r1.exec(t))) add(+m[3], +m[2], +m[1]);
  const r2 = /(?:^|[^\d.])(\d{1,2})\s*[.\/]\s*(20\d{2})(?![\d.])/g;              // 10/2026 -> конец месяца
  while ((m = r2.exec(t))) { const y = +m[2], mo = +m[1]; if (mo >= 1 && mo <= 12) kand.push(new Date(y, mo, 0)); }
  if (!kand.length) {
    const r3 = /(?:^|\D)(\d{2})(\d{2})(\d{2})(?:\D|$)/g;                          // 251026
    while ((m = r3.exec(t))) add(+m[3], +m[2], +m[1]);
  }
  const gut = kand.filter(d => d >= new Date(heute.getTime() - 60 * 86400000)).sort((a, b) => a - b);
  const d = gut[0] || kand[0];
  if (!d) return "";
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
async function leseDatum(file, status) {
  status.textContent = "читаю дату…";
  await ladeTesseract();
  const img = await createImageBitmap(file);
  const c = document.createElement("canvas");
  const sc = Math.min(1, 1600 / Math.max(img.width, img.height));
  c.width = img.width * sc; c.height = img.height * sc;
  const g = c.getContext("2d");
  g.filter = "grayscale(1) contrast(1.6)";
  g.drawImage(img, 0, 0, c.width, c.height);
  const res = await Tesseract.recognize(c, "eng", { tessedit_char_whitelist: "0123456789./-: " });
  return datumAusText(res.data.text);
}

// ---------- форма отметки ----------
function mhdForm(a) {
  const k = DATA.items[a];
  if (!MHD.url()) { einstellungen(); return; }
  const box = document.createElement("div");
  box.className = "mhdbox";
  box.innerHTML =
    '<div class="mhdtitel">📅 Срок на полке · ' + esc(k.art) + '</div>' +
    '<label class="mhdfoto">📷 Сфотографировать дату<input type="file" accept="image/*" capture="environment" hidden></label>' +
    '<div class="mhdstatus klein"></div><img class="mhdprev" alt="" style="display:none">' +
    '<div class="row" style="margin-top:8px"><input type="date" class="mhddat"><input type="number" class="mhdmenge" min="1" value="1" inputmode="numeric" style="max-width:80px"></div>' +
    '<input type="text" class="mhdkom" placeholder="комментарий (необязательно)" style="margin-top:8px;width:100%">' +
    '<div class="row" style="margin-top:8px"><button class="mhdok">Сохранить</button><button class="sec mhdab">Отмена</button></div>';
  const ziel = document.querySelector(".mhdzeile");
  ziel.after(box);
  const fi = box.querySelector("input[type=file]"), st = box.querySelector(".mhdstatus"), pv = box.querySelector(".mhdprev");
  const dat = box.querySelector(".mhddat");
  fi.onchange = async () => {
    const f = fi.files[0];
    if (!f) return;
    pv.src = URL.createObjectURL(f); pv.style.display = "block";
    try {
      const d = await leseDatum(f, st);
      if (d) { dat.value = d; st.textContent = "распознано: " + dmy(d) + " — проверьте"; }
      else st.textContent = "дату не распознал — выберите вручную";
    } catch (e) { st.textContent = e.message + " — выберите дату вручную"; }
  };
  box.querySelector(".mhdab").onclick = () => { box.remove(); };
  box.querySelector(".mhdok").onclick = async () => {
    if (!dat.value) { st.textContent = "укажите дату"; return; }
    const e = { action: "add", id: uuid(), art: k.art, ean: LETZTER_EAN, name: k.name_de || k.name || "",
      mhd: dat.value, menge: +box.querySelector(".mhdmenge").value || 1, kommentar: box.querySelector(".mhdkom").value || "" };
    const q = MHD.queue(); q.push(e); MHD.setQueue(q);
    if (pv.src) URL.revokeObjectURL(pv.src);
    box.remove();
    zeigeMhdZeile(a);
    st.textContent = "";
    mhdSync().then(() => zeigeMhdZeile(a));
  };
}

function zeigeMhdZeile(a) {
  const el = document.querySelector(".mhdzeile");
  if (!el) return;
  const k = DATA.items[a];
  const eig = mhdAlle().filter(x => x.status === "активен" && String(x.art) === String(k.art)).sort((x, y) => x.mhd < y.mhd ? -1 : 1);
  el.innerHTML = '<button class="mhdbtn">📅 MHD</button>' +
    eig.map(x => { const t = tageBis(x.mhd);
      return '<span class="mhdtag ' + (t <= 3 ? "rot" : (t <= 7 ? "gelb" : "")) + '">' + dmy(x.mhd) + ' ×' + x.menge +
        ' (' + (t < 0 ? "просрочен" : t + " дн") + ')' + (x.offen ? " ⏳" : "") + '</span>'; }).join("");
  el.querySelector(".mhdbtn").onclick = () => mhdForm(a);
}

// ---------- вкладка "Сроки" ----------
async function zeigeMhdListe() {
  AKTUELL = null;
  history.replaceState(null, "", "#mhd");
  const out = $("out");
  const render = () => {
    const l = mhdAlle().sort((x, y) => (x.status === "активен") - (y.status === "активен") || (x.mhd < y.mhd ? -1 : 1)).reverse();
    const aktiv = l.filter(x => x.status === "активен").sort((x, y) => x.mhd < y.mhd ? -1 : 1);
    const zu = l.filter(x => x.status !== "активен");
    let h = '<h3>Сроки на полке · активных ' + aktiv.length + '</h3>';
    if (!aktiv.length) h += '<div class="msg">Пока нет отметок. Откройте карточку товара и нажмите «📅 MHD».</div>';
    h += aktiv.map(x => { const t = tageBis(x.mhd);
      return '<div class="mhdrow ' + (t <= 3 ? "rot" : (t <= 7 ? "gelb" : "")) + '">' +
        '<div class="mhdkopf"><b>' + dmy(x.mhd) + '</b> · ' + (t < 0 ? "просрочен " + (-t) + " дн" : (t === 0 ? "сегодня" : "через " + t + " дн")) +
        ' · ×' + x.menge + (x.offen ? " ⏳" : "") + '</div>' +
        '<a href="#' + esc(artKey(x.art)) + '" data-a="' + esc(artKey(x.art)) + '">' + esc(x.art) + ' · ' + esc(x.name || "") + '</a>' +
        (x.kommentar ? '<div class="klein">' + esc(x.kommentar) + '</div>' : '') +
        '<div class="row mhdakt">' + ["уценён", "убран", "продан"].map(s => '<button class="sec" data-id="' + x.id + '" data-s="' + s + '">' + s + '</button>').join("") + '</div></div>';
    }).join("");
    if (zu.length) h += '<h3>Закрыто за 14 дней</h3>' + zu.map(x => '<div class="mhdrow zu">' + dmy(x.mhd) + ' · ' + esc(x.art) + ' · ' +
      esc(x.name || "") + ' · <i>' + esc(x.status) + '</i></div>').join("");
    out.innerHTML = h;
    out.querySelectorAll("[data-a]").forEach(el => el.onclick = (e) => { e.preventDefault(); if (DATA.items[el.dataset.a]) zeige(el.dataset.a); });
    out.querySelectorAll(".mhdakt button").forEach(b => b.onclick = () => {
      const q = MHD.queue(); q.push({ action: "status", id: b.dataset.id, status: b.dataset.s }); MHD.setQueue(q);
      render(); mhdSync().then(render);
    });
  };
  render();
  if (await mhdSync()) render();
}

// ---------- настройки ----------
function einstellungen() {
  const u = prompt("Адрес Google Apps Script (Web-App URL, заканчивается на /exec):", MHD.url());
  if (u === null) return;
  const s = prompt("Секретный ключ (как в свойстве SECRET скрипта):", MHD.key());
  if (s === null) return;
  lsSet("mm26mhd_url", u.trim()); lsSet("mm26mhd_key", s.trim());
  mhdSync().then(ok => alert(ok ? "Подключено ✔" : "Не удалось подключиться — проверьте адрес и ключ"));
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
start();
