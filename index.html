<script>
"use strict";
const ITER = 250000;
let DATA = null, PW = null, AKTUELL = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (v) => (v === null || v === undefined || v === "") ? "—" : String(v).replace(".", ",");
const artKey = (s) => { s = String(s || "").trim(); return /^\d+$/.test(s) ? String(parseInt(s, 10)) : s.toUpperCase(); };

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

async function holeBlob() {
  const r = await fetch("data.enc?t=" + Date.now(), { cache: "no-store" });   // метка - мимо кеша GitHub (до 10 мин)
  if (!r.ok) throw new Error("data.enc: HTTP " + r.status);
  return new Uint8Array(await r.arrayBuffer());
}

async function entschluesseln(buf, pw) {
  const magic = new TextDecoder().decode(buf.slice(0, 4));
  if (magic !== "MM26") throw new Error("неверный формат файла");
  const salt = buf.slice(4, 20), nonce = buf.slice(20, 32), ct = buf.slice(32);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, key, ct);   // ошибка = неверный пароль
  const ds = new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip")));
  return JSON.parse(await ds.text());
}

async function start() {
  let buf;
  try { buf = await holeBlob(); }
  catch (e) { $("stand").textContent = "нет данных"; $("info").innerHTML = '<div class="msg err">Не удалось загрузить данные: ' + esc(e.message) + '</div>'; return; }
  const pw = lsGet("mm26pw");
  if (pw) {

// ---------- фото из пакетов fotos_N.enc (скачиваются один раз, дальше из памяти телефона) ----------
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n;
  for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(str) { const b = new TextEncoder().encode(str); let c = 0xFFFFFFFF;
  for (const x of b) c = CRC[(c ^ x) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
let FOTOKEY = null; const SHARD = {};
function shardUrl(i) { return "fotos_" + i + ".enc?v=" + DATA.fotos.v[i]; }
async function fotoKey() {
  if (!FOTOKEY) {
    const salt = Uint8Array.from(atob(DATA.fotos.salt), c => c.charCodeAt(0));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(PW), "PBKDF2", false, ["deriveKey"]);
    FOTOKEY = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }
  return FOTOKEY;
}
function ladeShard(i) {
  if (!SHARD[i]) SHARD[i] = (async () => {
    const r = await fetch(shardUrl(i));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const buf = new Uint8Array(await r.arrayBuffer());
    const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(4, 16) }, await fotoKey(), buf.slice(16));
    const t = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    return JSON.parse(t);
  })().catch(e => { delete SHARD[i]; return {}; });
  return SHARD[i];
}
async function holeFoto(a) {
  if (!DATA.fotos || !DATA.fotos.n) return null;
  const pack = await ladeShard(crc32(a) % DATA.fotos.n);
  return pack[a] || null;
}
function fotosVorladen() {      // скачать все пакеты в память телефона (без расшифровки), чтобы работало без сети
  if (!DATA.fotos || !DATA.fotos.n) return;
  for (let i = 0; i < DATA.fotos.n; i++) fetch(shardUrl(i)).catch(() => {});
}

function sucheName(q) {
  const w = q.toLowerCase().split(/\s+/).filter(Boolean);

function suche(code) {
  const roh = String(code || "").trim();
  if (!roh) return;
  if (!/^[0-9MmCcRr\s]+$/.test(roh) || /[^\d\s]{3,}/.test(roh)) return sucheName(roh);
  code = roh.replace(/\s+/g, "");
  LETZTER_EAN = "";
  const items = DATA.items, a = artKey(code);
  const pluAlle = ((DATA.plu || {})[code] || []).map(x => typeof x === "string" ? { a: x, art: x, n: "" } : x);
  const pluTreffer = pluAlle.filter(x => x.a && items[x.a]).map(x => x.a);
  const pluOhne = pluAlle.filter(x => !(x.a && items[x.a]));
  if (items[a] && pluAlle.length && !(pluTreffer.length === 1 && pluTreffer[0] === a && !pluOhne.length)) {
    $("out").innerHTML = '<h3>' + esc(code) + ' — артикул или PLU весов?</h3><div class="wahl">' +
      '<a href="#' + a + '" data-a="' + a + '">артикул ' + esc(items[a].art) + ' · ' + esc(items[a].name_de || "") + '</a>' +
      pluTreffer.map(x => '<a href="#' + x + '" data-a="' + x + '">PLU ' + esc(code) + ' → ' + esc(items[x].art) + ' · ' +
        esc(items[x].name_de || "") + '</a>').join("") +
      pluOhne.map(x => '<a class="leer">PLU ' + esc(code) + ' → ' + esc(x.art || "без артикула") + ' · ' + esc(x.n) +
        ' <span class="klein">(нет продаж 90 дн и остатка)</span></a>').join("") + '</div>';
    bindLinks(); return;
  }
  if (items[a]) return zeige(a);
  if (pluTreffer.length === 1) return zeige(pluTreffer[0]);
  if (!pluTreffer.length && pluOhne.length) {
    $("out").innerHTML = '<div class="msg">PLU ' + esc(code) + ': ' + pluOhne.map(x => 'артикул <b>' + esc(x.art || "—") + '</b> ' +
      esc(x.n)).join("<br>") + '<br><span class="klein">Карточки нет: за 90 дней не продавался и нет остатка.</span></div>';
    return;
  }
  if (pluTreffer.length > 1) {
    $("out").innerHTML = '<h3>PLU ' + esc(code) + ' — несколько артикулов:</h3><div class="wahl">' +
      pluTreffer.map(x => '<a href="#' + x + '" data-a="' + x + '">' + esc(items[x].art) + ' · ' + esc(items[x].name_de || "") + '</a>').join("") + '</div>';
    bindLinks(); return;
  }
  const varianten = [code, "0" + code, code.replace(/^0+/, ""), "00" + code];   // UPC-A (12) <-> EAN-13
  let gef = [];
  for (const v of varianten) if (DATA.ean[v]) { gef = DATA.ean[v]; break; }
  const treffer = gef.filter(x => items[x]);
  if (treffer.length) LETZTER_EAN = code;
  if (treffer.length === 1) return zeige(treffer[0]);
  if (treffer.length > 1) {
    $("out").innerHTML = '<h3>Штрихкод ' + esc(code) + ' — несколько артикулов:</h3><div class="wahl">' +
      treffer.map(x => '<a href="#' + x + '" data-a="' + x + '">' + esc(items[x].art) + ' · ' + esc(items[x].name_de || items[x].name || "") + '</a>').join("") + '</div>';
    bindLinks(); return;
  }
  $("out").innerHTML = '<div class="msg err">' + esc(code) + ': не найден ни среди артикулов, ни среди штрихкодов ' +
    '(в карточках только товары с продажами за 90 дней или с остатком).</div>';
}

const MON = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];

function histogramm(k) {
  const mo = k.monate || [];
  if (!mo.length) return "";
  const W = 360, H = 160, top = 16, bottom = 22, n = mo.length, bw = W / n;
  const max = Math.max(1, ...mo.map(x => (x[2] || [x[1]]).reduce((p, t) => p + Math.max(t, 0), 0)));
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="продажи по месяцам">';
  mo.forEach((x, i) => {
    const total = x[1], teile = x[2] || [total, 0, 0, 0];
    const xx = i * bw + 4, w = bw - 8, aktuell = i === n - 1;
    let y = H - bottom;
    teile.forEach((t, j) => {                     // снизу вверх: обычные, промо, уценка, сотрудники
      if (!t || t <= 0) return;                   // возвраты (минус) не рисуем
      const h = (H - top - bottom) * t / max;
      y -= h;
      svg += '<rect x="' + xx + '" y="' + y + '" width="' + w + '" height="' + Math.max(h, 1) + '" fill="' + TEIL_FARBE[j] +
        '"' + (aktuell ? ' fill-opacity="0.55"' : '') + '><title>' + TEIL_NAME[j] + ': ' + fmt(Math.round(t)) + '</title></rect>';
    });
    svg += '<text x="' + (xx + w / 2) + '" y="' + (y - 3) + '" font-size="10" text-anchor="middle" fill="#111">' +
      (Math.round(total) > 0 ? fmt(Math.round(total)) : "") + '</text>';
    const m = +x[0].slice(5, 7) - 1;
    svg += '<text x="' + (xx + w / 2) + '" y="' + (H - 7) + '" font-size="10" text-anchor="middle" fill="#666">' +
      MON[m] + (m === 0 ? "'" + x[0].slice(2, 4) : "") + '</text>';
  });
  svg += '</svg>';
  const leg = TEIL_NAME.map((t, j) => '<span style="display:inline-flex;align-items:center;gap:3px;margin-right:9px">' +
    '<span style="width:10px;height:10px;border-radius:2px;background:' + TEIL_FARBE[j] + '"></span>' + t + '</span>').join("");
  return '<div class="hist"><div class="ht">продажи, шт в месяц (12 мес; последний — текущий, неполный)</div>' + svg +

let scanAktiv = false, stream = null, detector = null, timer = null;
async function scanStart() {
  try {
    detector = detector || new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128"] });
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } }, audio: false });
  } catch (e) {
    $("out").innerHTML = '<div class="msg err">Камера недоступна: ' + esc(e.message) + '</div>'; return;
  }
  const v = $("video");
  v.srcObject = stream; await v.play();
  $("scan").style.display = "block";
  scanAktiv = true; $("scanbtn").textContent = "✕ Стоп";
  const loop = async () => {
    if (!scanAktiv) return;
    try {
      const codes = await detector.detect(v);
      if (codes.length) {
        const c = codes[0].rawValue;
        if (navigator.vibrate) navigator.vibrate(80);
        scanStop(); suche(c); return;
      }
    } catch (e) {}
    timer = setTimeout(loop, 120);
  };
  loop();
}
function scanStop() {
  scanAktiv = false; clearTimeout(timer);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; $("scan").style.display = "none"; $("scanbtn").textContent = "📷 Сканировать";
}

// ======================= MHD: отметки сроков годности на полке =======================
// Записи уходят в Google-таблицу через Apps Script (URL + ключ вводятся один раз в ⚙).
// Фото нигде не хранится: только чтобы прочитать дату (распознавание на телефоне).
const MHD = {
  url: () => lsGet("mm26mhd_url") || "",
  key: () => lsGet("mm26mhd_key") || "",
  liste() { try { return JSON.parse(lsGet("mm26mhd_list") || "[]"); } catch (e) { return []; } },
  queue() { try { return JSON.parse(lsGet("mm26mhd_queue") || "[]"); } catch (e) { return []; } },
  setListe(l) { lsSet("mm26mhd_list", JSON.stringify(l)); },
  setQueue(q) { lsSet("mm26mhd_queue", JSON.stringify(q)); },
};
let LETZTER_EAN = "";

function tageBis(iso) {
  const d = new Date(iso + "T00:00:00"), h = new Date(); h.setHours(0, 0, 0, 0);
  return Math.round((d - h) / 86400000);
}
function isoDatum(v) {          // "2026-10-30" | "Fri Oct 30 2026 00:00:00 GMT+0100" | "2026-10-29T23:00:00.000Z" -> "2026-10-30"
  const t = String(v || "");
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  const d = new Date(t);
  if (isNaN(d)) return "";
  const ld = /T\d{2}:\d{2}.*Z$/.test(t) ? new Date(d.getTime() + 12 * 3600000) : d;   // UTC-полночь -> тот же день
  return ld.getFullYear() + "-" + String(ld.getMonth() + 1).padStart(2, "0") + "-" + String(ld.getDate()).padStart(2, "0");
}
function dmy(iso) { return iso ? iso.slice(8, 10) + "." + iso.slice(5, 7) + "." + iso.slice(2, 4) : ""; }
function uuid() { return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

async function mhdPost(obj) {
  const r = await fetch(MHD.url(), { method: "POST", body: JSON.stringify(Object.assign({ secret: MHD.key() }, obj)), redirect: "follow" });
  const j = await r.json();
  if (!j.ok) throw new Error(j.fehler || "ошибка сервера");
  return j;
}
async function mhdSync() {
  if (!MHD.url()) return false;
  let q = MHD.queue();
  for (const e of q.slice()) {
    try {
      await mhdPost(e);
      q = q.filter(x => !(x.id === e.id && x.action === e.action && x.status === e.status));
      MHD.setQueue(q);
    } catch (err) { break; }
  }
  try {
    const r = await fetch(MHD.url() + "?action=list&secret=" + encodeURIComponent(MHD.key()) + "&t=" + Date.now());
    const j = await r.json();
    if (j.ok) MHD.setListe(j.liste.map(x => Object.assign(x, { mhd: isoDatum(x.mhd) })));
  } catch (err) { return false; }
  return true;
}
function mhdAlle() {          // сервер + ещё не отправленное
  const l = MHD.liste();
  const ids = new Set(l.map(x => x.id));
  const q = MHD.queue();
  for (const e of q) {
    if (e.action === "add" && !ids.has(e.id)) l.push(Object.assign({ status: "активен", offen: true }, e));
    if (e.action === "status") { const x = l.find(y => y.id === e.id); if (x) { x.status = e.status; x.offen = true; } }
  }
  return l;
}

// ---------- распознавание даты на фото ----------
let TESS = null;
function ladeTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (TESS) return TESS;
  TESS = new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = ok; s.onerror = () => { TESS = null; fail(new Error("распознавание недоступно (нет сети?)")); };
    document.head.appendChild(s);
  });
  return TESS;
}
function datumAusText(t) {
  t = (t || "").replace(/[oO]/g, "0").replace(/[lI|]/g, "1").replace(/,/g, ".");
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const kand = [];
  const add = (y, m, d) => {
    if (y < 100) y += 2000;
    if (m < 1 || m > 12 || d < 1 || d > 31 || y < 2020 || y > 2040) return;
    const dt = new Date(y, m - 1, d);
    if (dt.getMonth() !== m - 1) return;
    kand.push(dt);
  };
  let m;
  const r1 = /(\d{1,2})\s*[.\/\-]\s*(\d{1,2})\s*[.\/\-]\s*(\d{2,4})/g;          // 25.10.2026 / 25/10/26
  while ((m = r1.exec(t))) add(+m[3], +m[2], +m[1]);
  const r2 = /(?:^|[^\d.])(\d{1,2})\s*[.\/]\s*(20\d{2})(?![\d.])/g;              // 10/2026 -> конец месяца
  while ((m = r2.exec(t))) { const y = +m[2], mo = +m[1]; if (mo >= 1 && mo <= 12) kand.push(new Date(y, mo, 0)); }
  if (!kand.length) {
    const r3 = /(?:^|\D)(\d{2})(\d{2})(\d{2})(?:\D|$)/g;                          // 251026
    while ((m = r3.exec(t))) add(+m[3], +m[2], +m[1]);
  }
  const gut = kand.filter(d => d >= new Date(heute.getTime() - 60 * 86400000)).sort((a, b) => a - b);
  const d = gut[0] || kand[0];
  if (!d) return "";
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
async function leseDatum(file, status) {
  status.textContent = "читаю дату…";
  await ladeTesseract();
  const img = await createImageBitmap(file);
  const c = document.createElement("canvas");
  const sc = Math.min(1, 1600 / Math.max(img.width, img.height));
  c.width = img.width * sc; c.height = img.height * sc;
  const g = c.getContext("2d");
  g.filter = "grayscale(1) contrast(1.6)";
  g.drawImage(img, 0, 0, c.width, c.height);
  const res = await Tesseract.recognize(c, "eng", { tessedit_char_whitelist: "0123456789./-: " });
  return datumAusText(res.data.text);
}

const C128 = "212222,222122,222221,121223,121322,131222,122213,122312,132212,221213,221312,231212,112232,122132,122231,113222,123122,123221,223211,221132,221231,213212,223112,312131,311222,321122,321221,312212,322112,322211,212123,212321,232121,111323,131123,131321,112313,132113,132311,211313,231113,231311,112133,112331,132131,113123,113321,133121,313121,211331,231131,213113,213311,213131,311123,311321,331121,312113,312311,332111,314111,221411,431111,111224,111422,121124,121421,141122,141221,112214,112412,122114,122411,142112,142211,241211,221114,413111,241112,134111,111242,121142,121241,114212,124112,124211,411212,421112,421211,212141,214121,412121,111143,111341,131141,114113,114311,411113,411311,113141,114131,311141,411131,211412,211214,211232,2331112".split(",");
const EAN_L = ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
const EAN_G = ["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"];
const EAN_R = ["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"];
const EAN_P = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function eanPruef(s) {             // контрольная цифра для строки без неё
  let sum = 0;
  for (let i = 0; i < s.length; i++) sum += (+s[s.length - 1 - i]) * (i % 2 === 0 ? 3 : 1);
  return String((10 - sum % 10) % 10);
}
function eanBits(code) {           // '0'/'1' модули или null
  if (/^\d{12}$/.test(code)) code = "0" + code;                    // UPC-A -> EAN-13
  if (/^\d{13}$/.test(code)) {
    let b = "101";
    for (let i = 1; i < 7; i++) b += (EAN_P[+code[0]][i - 1] === "L" ? EAN_L : EAN_G)[+code[i]];
    b += "01010";
    for (let i = 7; i < 13; i++) b += EAN_R[+code[i]];
    return b + "101";
  }
  if (/^\d{8}$/.test(code)) {
    let b = "101";
    for (let i = 0; i < 4; i++) b += EAN_L[+code[i]];
    b += "01010";
    for (let i = 4; i < 8; i++) b += EAN_R[+code[i]];
    return b + "101";
  }
  return null;
}
function c128Bits(text) {          // Code128 B (печатные ASCII 32..126)
  const vals = [104];
  for (const ch of text) { const v = ch.charCodeAt(0) - 32; if (v < 0 || v > 94) return null; vals.push(v); }
  let sum = 104;
  for (let i = 1; i < vals.length; i++) sum += vals[i] * i;
  vals.push(sum % 103, 106);
  let b = "";
  for (const v of vals) { const w = C128[v]; for (let i = 0; i < w.length; i++) b += (i % 2 === 0 ? "1" : "0").repeat(+w[i]); }
  return b;
}
function shkSvg(code) {
  const ean = eanBits(code), bits = ean || c128Bits(code);
  if (!bits) return "";
  const q = 12, m = 3, h = 120, W = (bits.length + 2 * q) * m;
  let svg = '<svg viewBox="0 0 ' + W + ' ' + (h + 30) + '" width="100%" style="max-width:' + W + 'px;background:#fff" shape-rendering="crispEdges">';
  let x = q * m, i = 0;
  while (i < bits.length) {
    let j = i; while (j < bits.length && bits[j] === bits[i]) j++;
    if (bits[i] === "1") svg += '<rect x="' + (x + i * m) + '" y="6" width="' + ((j - i) * m) + '" height="' + h + '" fill="#000"/>';
    i = j;
  }
  svg += '<text x="' + (W / 2) + '" y="' + (h + 26) + '" font-size="22" text-anchor="middle" font-family="monospace" fill="#000">' + esc(code) + '</text>';
  return svg + '</svg>';
}
let EAN_VON = null;
function eansVon(a) {
  if (!EAN_VON) {
    EAN_VON = {};
    for (const [e, arts] of Object.entries(DATA.ean || {})) for (const x of arts) (EAN_VON[x] = EAN_VON[x] || []).push(e);
  }
  return (EAN_VON[a] || []).slice().sort((x, y) => y.length - x.length);
}
function zeigeShk(a) {
  const box = $("shkbox"), k = DATA.items[a];
  if (box.innerHTML) { box.innerHTML = ""; return; }
  const eans = eansVon(a);
  let h = '<div class="shkwahl">';
  if (eans.length) {
    h += eans.map(e => '<div class="shkitem">' + shkSvg(e) + '<div class="klein">EAN ' + (eanBits(e) && /^\d{8,13}$/.test(e) &&
      eanPruef(e.slice(0, -1)) !== e.slice(-1) ? '· <b style="color:#c00">контрольная цифра не сходится</b>' : '') + '</div></div>').join("");
  } else {
    h += '<div class="msg">В каталоге teleNorma для ' + esc(k.art) + ' нет EAN. Ниже штрихкод артикула (Code128) — касса примет его, только если ищет по номеру артикула.</div>' +
      '<div class="shkitem">' + shkSvg(String(k.art)) + '</div>';
  }
  box.innerHTML = h + '<div class="klein">Яркость экрана — на максимум, держите телефон ровно перед сканером.</div></div>';
  box.scrollIntoView({ behavior: "smooth", block: "center" });
}

// ======================= ДАШБОРД =======================
const DM = { an: false };
function modus(m) {                       // "k" карточка | "d" дашборд
  DM.an = m === "d";
  $("tabK").classList.toggle("on", !DM.an); $("tabD").classList.toggle("on", DM.an);
  $("suchform").style.display = DM.an ? "none" : "";
  if ($("scanbtn")) $("scanbtn").style.visibility = DM.an ? "hidden" : "";
  if (DM.an && typeof scanAktiv !== "undefined" && scanAktiv) scanStop();
}
const nbsp = (x) => String(x).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
function eur(v) {
  if (v === null || v === undefined) return "—";
  if (Math.abs(v) >= 10000) { const t = v / 1000; return nbsp((Math.abs(t) >= 1000 ? Math.round(t) : t.toFixed(1)).toString()).replace(".", ",") + ' <small>т€</small>'; }
  return nbsp(Math.round(v)) ;
}
const zahl0 = (v) => v === null || v === undefined ? "—" : nbsp(Math.round(v));
const dez = (v, n) => v === null || v === undefined ? "—" : v.toFixed(n).replace(".", ",");
function delta(d, txt, inv, pkt) {        // inv: рост = плохо; pkt: процентные пункты
  if (d === null || d === undefined) return '<div class="na">—<i>' + txt + '</i></div>';
  const gut = inv ? d < 0 : d > 0, cls = d === 0 ? "" : (gut ? "up" : "dn");
  return '<div class="' + cls + '">' + (d > 0 ? "▲ +" : (d < 0 ? "▼ −" : "")) + dez(Math.abs(d), Math.abs(d) >= 10 || pkt ? (pkt ? 1 : 0) : 1) +
    (pkt ? " п." : "%") + '<i>' + txt + '</i></div>';
}
function jdelta(d, inv, pkt) {
  if (d === null || d === undefined) return '<em class="na">— к пр. году</em>';
  const gut = inv ? d < 0 : d > 0;
  return '<em class="' + (gut ? "up" : "dn") + '">' + (d > 0 ? "▲ +" : "▼ −") + dez(Math.abs(d), 1) + (pkt ? " п." : "%") + ' к пр. году</em>';
}
function dChart(a, b, klein, teiler) {
  const W = klein ? 170 : 360, H = klein ? 78 : 120, M = DATA.dash.monate;
  const t = teiler || 1, A = a.map(x => x === null ? null : x / t), B = b.map(x => x === null ? null : x / t);
  const alle = A.concat(B).filter(x => x !== null);
  if (!alle.length) return "";
  const mn = Math.min(...alle), mx = Math.max(...alle), sp = (mx - mn) || mx * 0.1 || 1;
  const lo = mn - sp * 0.35, hi = mx + sp * 0.08;
  const bt = klein ? 13 : 18, tp = 6, lx = klein ? 0 : 30, bw = (W - lx) / 13;
  const y = v => H - bt - (H - bt - tp) * (v - lo) / (hi - lo);
  let s = '<svg class="' + (klein ? "mini" : "gross") + '" viewBox="0 0 ' + W + ' ' + H + '">';
  if (!klein) [lo, (lo + hi) / 2, hi].forEach(v => {
    s += '<line x1="' + lx + '" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#e2e2e2"/>' +
      '<text x="' + (lx - 3) + '" y="' + (y(v) + 3) + '" font-size="8.5" text-anchor="end" fill="#888">' + nbsp(Math.round(v)) + '</text>';
  });
  A.forEach((v, i) => {
    const x = lx + i * bw + (klein ? 0.6 : 2), w = bw - (klein ? 1.2 : 4);
    if (B[i] !== null) s += '<rect x="' + x + '" y="' + y(B[i]) + '" width="' + (w / 2) + '" height="' + Math.max(0, H - bt - y(B[i])) + '" fill="#C5CEDF"/>';
    if (v !== null) s += '<rect x="' + (x + w / 2) + '" y="' + y(v) + '" width="' + (w / 2) + '" height="' + Math.max(0, H - bt - y(v)) + '" fill="' + (i === 12 ? "#7F93B8" : "#1F3864") + '"/>';
    if (!klein || i % 3 === 0) s += '<text x="' + (x + w / 2) + '" y="' + (H - 3) + '" font-size="' + (klein ? 8 : 9) + '" text-anchor="middle" fill="#666">' + esc(M[i]) + '</text>';
  });
  return s + '</svg>';
}
function kachel(titel, k, f, opt) {
  opt = opt || {};
  return '<div class="kpi' + (opt.breit ? " breit" : "") + '">' + (titel ? '<h4>' + titel + '</h4>' : '') +
    '<div class="zw"><div><i>' + (opt.lj || "год") + '</i><b>' + f(k.j) + '</b>' + (opt.ohneJ ? '' : jdelta(k.djj, opt.inv, opt.pkt)) + '</div>' +
    '<div><i>' + (opt.lm || "мес") + '</i><b>' + f(k.m) + '</b></div></div>' +
    '<div class="vgl">' + delta(k.dm, "к пр. мес", opt.inv, opt.pkt) + delta(k.dj, "к пр. году", opt.inv, opt.pkt) + '</div>' +
    (opt.note ? '<div class="note">' + opt.note + '</div>' : '') +
    dChart(k.a, k.b, !opt.breit, opt.teiler) + (opt.breit && opt.cnote ? '<div class="note">' + opt.cnote + '</div>' : '') + '</div>';

function zeigeDash() {

    ["A", "B", "C"].map(c => { const x = sl[c] || {};

      return '<tr><td class="k">' + c + '</td><td>' + pr(x.j) + '</td><td>' + pr(x.m) + '</td>' + d + '<td class="na">—</td></tr>'; }).join("") +

  const st = K.std, es = K.eur_std;
  h += '<div class="kpi breit"><h4>FTE</h4>' +
    '<div class="zw"><div><i>год, ср. FTE</i><b>' + dez(K.fte.j, 1) + '</b>' + jdelta(K.fte.djj, true) + '</div><div><i>мес, часов</i><b>' + zahl0(st.m) + ' <small>ч</small></b></div></div>' +

    dChart(st.a, st.b, false) + '<div class="note">часов в месяц по плану</div></div>';
  h += '</div><div class="klein" style="text-align:center;margin-top:8px">посчитано ' + esc(D.stand) + '</div>';
  $("out").innerHTML = h;
